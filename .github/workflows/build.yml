name: Build Sleuth

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run ranking tests
        shell: pwsh
        run: |
          dotnet build tests/SpaceSleuth.Tests/SpaceSleuth.Tests.csproj -c Release -o test-out
          ./test-out/SpaceSleuth.Tests.exe
          if ($LASTEXITCODE -ne 0) { throw "Tests failed" }

      - name: Build app
        shell: pwsh
        run: dotnet build src/SpaceSleuth/SpaceSleuth.csproj -c Release -o out -p:Version=1.0.${{ github.run_number }} -p:InformationalVersion=1.0.${{ github.run_number }}

      - name: Build installer (Sleuth-Setup.exe)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=1.0.${{ github.run_number }}" installer\Sleuth.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sleuth
          path: |
            out/Sleuth-Setup.exe
            out/Sleuth.exe

      - name: Publish as the "latest" release (direct .exe download link)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/Sleuth-Setup.exe out/Sleuth.exe \
            --target "$GITHUB_SHA" \
            --title "Sleuth v1.0.${{ github.run_number }}" \
            --notes "Built automatically from commit ${GITHUB_SHA::7}. Download **Sleuth-Setup.exe** to install it like any other program (Start menu shortcut, uninstall from Settings > Apps). **Sleuth.exe** is the same app with no install, if you'd rather just run it." \
            --latest
